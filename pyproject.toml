[project]
name = "youtube-book-script-agent"
version = "0.1.0"
description = "Local-first analysis of Markdown book notes for evidence-grounded YouTube scripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.68,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "python-frontmatter>=1.1,<2",
  "pyyaml>=6.0,<7",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
book-agent = "app.cli:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
